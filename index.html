<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#c3d9e7">
<title>결혼식에 초대합니다</title>
<!-- 미리보기(카카오톡 등)에 보이는 정보. 얼굴 사진·연락처는 넣지 마세요. -->
<meta property="og:title" content="결혼식에 초대합니다">
<meta property="og:description" content="2027년 3월 6일, 한강 위에서">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<script>
/* ════════════════════════════════════════════════════════════════
   ★ 여기만 고치면 됩니다 ★
   - 대괄호 [ ] 로 된 값은 아직 채우지 않은 자리입니다.
   - 전화번호는 이 파일에 절대 넣지 않습니다. (서버 비밀값으로만 보관)
   ════════════════════════════════════════════════════════════════ */
const CONFIG = {
  // true: 미리보기 모드(참석 여부 저장·전화 연결 안 함) / false: 서버 연결 후 실제 동작
  demo: true,

  groom: { name: "[신랑 이름]", father: "[아버지 성함]", mother: "[어머니 성함]", relation: "아들" },
  bride: { name: "[신부 이름]", father: "[아버지 성함]", mother: "[어머니 성함]", relation: "딸" },

  wedding: {
    date: "2027-03-06",          // YYYY-MM-DD
    time: "11:30",               // 24시간제 "HH:MM"
    venue: "세빛섬 플로팅아일랜드",
    hall: "2층 컨벤션",
    address: "서울 서초구 올림픽대로 2085-14",
  },

  greeting: {
    title: "초대합니다",
    lines: [
      "강물 위에 빛이 번지듯",
      "서로의 하루를 밝혀 온 두 사람이",
      "이제 같은 빛으로 살아가려 합니다.",
      "",
      "그 첫날에 함께해 주시면",
      "더없이 기쁘겠습니다.",
    ],
  },

  // 사진: 이 파일 옆에 photos 폴더를 만들고 파일을 넣은 뒤 경로를 적습니다. (첫 장이 크게 보입니다)
  photos: [
    "photos/01.jpg", "photos/02.jpg", "photos/03.jpg",
    "photos/04.jpg", "photos/05.jpg",
  ],

  // (선택, 버전 5) 대표 사진 위에 넣는 짧은 영상. 비워두면 사진만 나옵니다.
  // mp4(H.264), 5~8초, 소리 없음, 2MB 이하 권장. poster 는 영상이 뜨기 전에 보이는 사진입니다.
  video: { src: "", poster: "" },

  // 음악: music 폴더에 넣고 경로를 적습니다. (mp3 권장, 2~3MB 이하)
  music: { src: "music/bgm.mp3", volume: 0.55 },

  // 지도 앱으로 여는 링크 (검색어만 바꿔도 됩니다)
  maps: [
    { label: "네이버 지도", url: "https://map.naver.com/p/search/세빛섬" },
    { label: "카카오맵",   url: "https://map.kakao.com/link/search/세빛섬" },
    { label: "티맵",       url: "tmap://search?name=세빛섬" },
  ],

  // 오시는 길: 항목과 줄 수는 자유롭게 추가·삭제
  directions: [
    { title: "셔틀버스", lines: ["고속터미널역(3·7·9호선)에서 탑승", "10~15분 간격으로 운행", "[타는 곳: 출구 번호]"] },
    { title: "지하철",   lines: ["3·7·9호선 고속터미널역에서 내려 셔틀버스 이용"] },
    { title: "자가용",   lines: ["내비게이션에 '세빛섬' 또는 '반포한강공원 2주차장' 검색"] },
    { title: "주차",     lines: ["3시간 주차권을 드립니다"] },
  ],

  // 연락 버튼: id 는 서버에 저장한 번호를 찾는 열쇠입니다. 번호는 여기에 쓰지 않습니다.
  contacts: {
    groomSide: [
      { id: "groom",        role: "신랑" },
      { id: "groom_father", role: "신랑 아버지" },
      { id: "groom_mother", role: "신랑 어머니" },
    ],
    brideSide: [
      { id: "bride",        role: "신부" },
      { id: "bride_father", role: "신부 아버지" },
      { id: "bride_mother", role: "신부 어머니" },
    ],
  },

  rsvp: { deadline: "2027-02-20", maxGuests: 6 },

  api: { rsvp: "/api/rsvp", contact: "/api/contact" },

  // 이 날짜가 지나면 초대장이 닫힙니다.
  closeAfter: "2027-03-20",
};
</script>

<style>
/* 버전 6 — 2인용 자전거: 바퀴를 돌리거나 화면을 내리면 두 사람이 한강변을 달려 세빛섬에 도착합니다 */
:root{
  --bg:#f5f6f4; --ink:#14222c; --muted:#677783; --accent:#2c6686; --accent-ink:#fff; --sunday:#b4574d;
  --line:rgba(20,34,44,.1); --line-strong:rgba(20,34,44,.22); --surface:#e7ecec; --chrome:rgba(245,246,244,.84);
  --radius:4px; --h-weight:300;
  --text:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --display:var(--text);
  --w:min(100vw,520px); --u:calc(var(--w) / 390);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.75;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body.locked{overflow:hidden;height:100svh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img{-webkit-touch-callout:none;user-select:none}

#skip{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));padding:8px 15px;font-family:var(--text);font-size:14px;
  border-radius:999px;z-index:12;transition:opacity .6s}
#intro.done #skip{opacity:0;pointer-events:none}
#down{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));font-family:var(--text);font-size:14px;
  opacity:0;transition:opacity 1.2s .8s;text-align:center;z-index:11;pointer-events:none}
#down::after{content:"";display:block;width:8px;height:8px;margin:8px auto 0;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg);animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px) rotate(45deg)}}
#intro.done #down{opacity:.8}

main[hidden]{display:none}
.sec{max-width:480px;margin:0 auto;padding:96px 28px 0}
.sec h2{font-family:var(--display);font-weight:var(--h-weight);font-size:27px;letter-spacing:-.01em;line-height:1.3;margin-bottom:30px}

#greet .lines{font-family:var(--display);font-size:18px;line-height:2.1}
#greet .lines span{display:block;min-height:1em}
.family{margin-top:44px;padding-top:28px;border-top:1px solid var(--line);font-size:16.5px;line-height:2.1}
.family b{font-weight:600;font-size:1.1em;margin-left:.3em}
.family em{font-style:normal;color:var(--muted);margin:0 .3em;font-size:.92em}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid button{display:block;position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surface)}
.grid button:first-child{grid-column:1/-1;aspect-ratio:4/5}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;white-space:pre-line;
  font-size:13px;line-height:1.5;color:var(--muted)}

#when .big{font-family:var(--display);font-weight:var(--h-weight);font-size:24px;line-height:1.5}
#when .big span{display:block;color:var(--accent)}
.cal{margin-top:30px;display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.cal .dow{color:var(--muted);font-size:13px;padding-bottom:8px}
.cal span{height:38px;display:flex;align-items:center;justify-content:center}
.cal .sun{color:var(--sunday)}
.cal .day{position:relative;z-index:0;color:var(--accent-ink);font-weight:600}
.cal .day::before{content:"";position:absolute;width:36px;height:36px;border-radius:50%;background:var(--accent);z-index:-1}
.dday{margin-top:22px;font-size:15.5px;color:var(--muted)}

#where .venue{font-family:var(--display);font-weight:var(--h-weight);font-size:23px;line-height:1.45}
#where .addr{font-size:15.5px;color:var(--muted);margin-top:6px}
.maps{display:flex;gap:8px;margin:24px 0 36px}
.maps a{flex:1;text-align:center;text-decoration:none;color:var(--ink);font-size:15px;padding:13px 4px;border:1px solid var(--line-strong);border-radius:var(--radius)}
.maps a:active{background:var(--surface)}
.way{display:grid;grid-template-columns:4.6em 1fr;column-gap:14px;padding:17px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.65}
.way dt{font-weight:600}
.way dd p+p{margin-top:3px}

#rsvp p.lead{font-size:16px;color:var(--muted);margin-bottom:26px}
form{font-size:16px}
fieldset{border:0;margin-bottom:22px}
fieldset[hidden]{display:none}
legend,label.t{display:block;font-size:14.5px;color:var(--muted);margin-bottom:9px}
.pills{display:flex;gap:8px}
.pills label{flex:1;position:relative}
.pills input{position:absolute;opacity:0;inset:0}
.pills span{display:block;text-align:center;padding:13px 4px;border:1px solid var(--line-strong);border-radius:var(--radius);transition:background .2s,color .2s,border-color .2s}
.pills input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.pills input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
input[type=text],select{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:transparent;
  border:1px solid var(--line-strong);border-radius:var(--radius);appearance:none;-webkit-appearance:none}
input::placeholder{color:var(--muted);opacity:.6}
.send{width:100%;padding:17px;border-radius:var(--radius);background:var(--ink);color:var(--bg);font-size:17px;font-weight:600;margin-top:6px}
.send:disabled{opacity:.5}
.fine{margin-top:14px;font-size:13.5px;color:var(--muted);line-height:1.6}

.side+.side{margin-top:36px}
.side h3{font-size:14.5px;font-weight:600;color:var(--accent);margin-bottom:6px}
.person{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.person .who{flex:1;min-width:0;font-size:17px}
.person .who small{display:block;font-size:13.5px;color:var(--muted);line-height:1.4}
.ico{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;transition:background .2s}
.ico:active{background:var(--surface)}
.ico svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

footer{max-width:480px;margin:96px auto 0;padding:32px 28px calc(110px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  font-size:13.5px;color:var(--muted);line-height:1.7}

#music{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;z-index:20;
  background:var(--chrome);border:1px solid var(--line-strong);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;gap:3px}
#music.ready{display:flex}
#music i{width:2.5px;height:14px;background:var(--ink);border-radius:2px;transform:scaleY(.25);transform-origin:50% 100%}
#music.playing i{animation:eq 1s ease-in-out infinite}
#music.playing i:nth-child(2){animation-delay:.2s}
#music.playing i:nth-child(3){animation-delay:.45s}
@keyframes eq{50%{transform:scaleY(1)}}

#viewer{position:fixed;inset:0;z-index:30;background:rgba(8,10,14,.96);display:none;align-items:center;justify-content:center}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer button{position:absolute;color:#f4f4f2}
#viewer .x{top:calc(10px + env(safe-area-inset-top));right:10px;padding:12px 16px;font-size:15px}
#viewer .nav{top:0;bottom:0;width:30%;font-size:0}
#viewer .prev{left:0}#viewer .next{right:0}
#viewer .count{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:14px;color:#a9adb3}

#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:40;width:max-content;max-width:calc(100% - 40px);
  padding:13px 18px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:15px;line-height:1.5;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#closed{display:none;min-height:100svh;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:18px;line-height:2}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
}

/* 걷는 구간: 세로로 긴 트랙 안에서 장면이 화면에 붙어 있습니다 */
#intro{position:relative;height:380vh;height:380svh;background:#e9e5db}
.stage{--p:0;position:sticky;top:0;height:100vh;height:100svh;min-height:540px;width:var(--w);margin:0 auto;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:linear-gradient(#b5d1e3 0%,#d6e5ed 30%,#f4eee2 56.5%,#f6f0e4 57%)}
.stage::before{content:"";position:absolute;left:30%;top:14%;width:95%;aspect-ratio:1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,252,240,.95),rgba(255,250,235,.4) 30%,rgba(255,250,235,0) 62%)}
.layer{position:absolute;left:0;will-change:transform}
.layer svg{display:block;width:100%;height:auto;overflow:visible}
#far{bottom:43%;width:calc(var(--w) * 1.4);transform:translate3d(calc(var(--p) * -28.570%),0,0)}
#river{position:absolute;left:0;right:0;bottom:20%;height:23%;background:linear-gradient(#bfd3dd,#8fb0c3)}
#glints{position:absolute;inset:0;width:100%;height:100%}
#mid{bottom:calc(43% - var(--u) * 30);width:calc(var(--w) * 2.2);transform:translate3d(calc(var(--p) * -54.540%),0,0)}
#ground{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(#aebfa9 0,#b9c8b3 9%,#ece8de 9.5%,#e4dfd3 100%)}
#lane{position:absolute;left:0;bottom:3.2%;height:2px;width:calc(var(--w) * 4.68);opacity:.9;transform:translate3d(calc(var(--p) * -78.630%),0,0);
  background:repeating-linear-gradient(90deg,#fff 0 calc(var(--u) * 30),transparent 0 calc(var(--u) * 74))}
#near{bottom:calc(20% - var(--u) * 4);width:calc(var(--w) * 4.68);transform:translate3d(calc(var(--p) * -78.630%),0,0)}
#fore{bottom:0;width:calc(var(--w) * 5.6);transform:translate3d(calc(var(--p) * -82.140%),0,0);pointer-events:none}

.hill{fill:#c5d5de}.hill.b{fill:#b4c9d4}.tower{fill:#9fb6c4}
.sky-line rect{fill:#a9bfcc;opacity:.75}
.span{fill:none;stroke:#7f9bac;stroke-width:1.3}.span.deck{stroke-width:2.2}
.glass{fill:#f4f8fa;stroke:rgba(20,34,44,.55);stroke-width:1.4}
.ink{fill:#1b2e3a}.stroke{fill:none;stroke:#1b2e3a;stroke-linecap:round}
#ship{animation:cruise 70s linear infinite alternate}
@keyframes cruise{to{transform:translateX(120px)}}
.duck{animation:paddle 3.800s ease-in-out infinite alternate}
@keyframes paddle{to{transform:translate(5px,.8px)}}
.reed{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.500s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.200deg)}to{transform:rotate(2.400deg)}}

/* 2인용 자전거 */
#bike{position:absolute;left:calc(var(--w) * .035);bottom:6.8%;width:calc(var(--u) * 304);z-index:4;pointer-events:none}
#bike svg{display:block;width:100%;overflow:visible}
.flow{transform-box:fill-box;transform-origin:100% 30%;animation:flutter 1.700s ease-in-out infinite alternate}
.flow.b{animation-duration:2.300s;animation-delay:-.6s}
@keyframes flutter{from{transform:rotate(-3deg) scaleX(.96)}to{transform:rotate(5deg) scaleX(1.050)}}

/* 돌리는 바퀴 */
#dial{position:absolute;left:50%;top:40%;width:min(54vw,214px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:8;touch-action:none;cursor:grab;border-radius:50%;
  background:rgba(255,255,255,.42);box-shadow:0 0 0 10px rgba(255,255,255,.2);
  transition:left .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1),width .8s cubic-bezier(.5,0,.2,1),opacity .6s,box-shadow .8s,background .8s}
#dial svg{display:block;width:100%;height:100%;overflow:visible}
#dial:active{cursor:grabbing}
.stage.rolling #dial{left:calc(100% - 52px);top:41%;width:78px;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.stage.arrived #dial{opacity:0;pointer-events:none}
#tip{position:absolute;left:0;right:0;top:calc(40% + min(27vw,107px) + 16px);z-index:8;text-align:center;color:var(--ink);font-size:18px;font-weight:600;pointer-events:none;transition:opacity .5s}
#tip span{display:inline-block;padding:10px 20px 11px;border-radius:14px;background:rgba(255,255,255,.78)}
#tip small{display:block;margin-top:4px;font-size:14px;font-weight:400;color:var(--muted)}
.stage.rolling #tip{opacity:0}
.hint-arc{fill:none;stroke:#14222c;stroke-width:2.2;stroke-linecap:round;opacity:.55;transition:opacity .5s}
.stage.rolling .hint-arc{opacity:0}

#haze{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(rgba(236,241,243,.9),rgba(238,240,238,.75) 60%,rgba(226,233,236,.5));opacity:calc(.62 - var(--p) * 1.5)}

.say{position:absolute;left:28px;right:28px;top:11.5%;z-index:7;color:var(--ink);opacity:0;pointer-events:none;will-change:opacity,transform}
.say p{font-weight:200;font-size:min(8.6vw,4.7svh,40px);line-height:1.36;letter-spacing:-.025em}
.say.fin h1{font-weight:200;font-size:min(10.6vw,5.6svh,50px);line-height:1.2;letter-spacing:-.025em}
.say.fin h1 small{display:block;font-size:.3em;font-weight:400;letter-spacing:.02em;margin:.6em 0 .5em;color:var(--accent)}
.say.fin .info{margin-top:20px;font-size:16px;line-height:1.65;font-weight:400;letter-spacing:0}
.say.fin .info b{font-weight:600}

#skip{color:var(--ink);border:1px solid var(--line-strong);background:rgba(255,255,255,.55)}
.stage.arrived #skip{opacity:0;pointer-events:none}
#walk{position:absolute;left:50%;bottom:calc(1.3% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;white-space:nowrap;
  padding:9px 16px 9px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14.500px;display:flex;align-items:center;gap:9px}
#walk::after{content:"";width:7px;height:7px;border-right:1.500px solid #fff;border-bottom:1.500px solid #fff;transform:translateY(-2px) rotate(45deg);animation:nudge 1.8s ease-in-out infinite}

.petal{position:absolute;top:-4%;width:9px;height:7px;border-radius:70% 30% 70% 30%;background:#f0c9c6;opacity:0;z-index:5;pointer-events:none}
.stage.arrived .petal{animation:petal 7s linear infinite}
@keyframes petal{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:.9}100%{opacity:0;transform:translate(-70px,95svh) rotate(520deg)}}
.stage.away *{animation-play-state:paused!important}

/* 본문 */
main{background:linear-gradient(#e4dfd3,var(--bg) 130px)}
#greet{padding-top:130px}
.family p{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.family p span{color:var(--muted);font-size:15.500px}
.family b{white-space:nowrap;font-size:19px;margin:0}
.copy{display:inline-block;margin-top:10px;font-size:14px;color:var(--accent);text-decoration:underline;text-underline-offset:4px;padding:6px 0}
.grid img{filter:blur(18px) saturate(.6);opacity:.35;transform:scale(1.06);transition:filter 1.4s ease,opacity 1.4s ease,transform 1.8s ease}
.grid button.seen img{filter:none;opacity:1;transform:none}
.grid .vid{grid-column:1/-1;aspect-ratio:4/5;background:var(--surface);overflow:hidden}
.grid .vid video{width:100%;height:100%;object-fit:cover;display:block}
.sec h2 .mark{display:block;width:28px;height:1px;background:var(--ink);margin-bottom:22px;transform-origin:0 50%;transform:scaleX(0);transition:transform .9s ease .1s}
.sec.seen h2 .mark{transform:none}
/* 본문에서도 두 사람이 화면 위쪽 길을 끝까지 걷습니다 */
#trail{position:fixed;left:0;right:0;top:0;height:calc(40px + env(safe-area-inset-top));z-index:15;pointer-events:none;opacity:0;transition:opacity .5s;
  background:var(--chrome);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line-strong)}
#trail.on{opacity:1}
#trail svg{position:absolute;bottom:1px;left:0;width:52px;overflow:visible;transform:translateX(calc(var(--q,0) * (100vw - 52px)))}
</style>
</head>
<body>

<section id="intro" aria-label="두 사람이 자전거로 한강변을 달리는 첫 화면">
  <div class="stage" id="stage">
    <div class="layer" id="far"><svg viewBox="0 0 546 150" aria-hidden="true"></svg></div>
    <div id="river"><canvas id="glints" aria-hidden="true"></canvas></div>
    <div class="layer" id="mid"><svg viewBox="0 0 858 90" aria-hidden="true"></svg></div>
    <div id="ground"></div>
    <div id="lane"></div>
    <div class="layer" id="near"><svg viewBox="0 0 1404 260" aria-hidden="true"></svg></div>

    <div id="bike" aria-hidden="true"><svg viewBox="0 0 262 190"></svg></div>

    <div class="layer" id="fore"><svg viewBox="0 0 1794 120" aria-hidden="true"></svg></div>
    <div id="haze"></div>

    <div class="say" data-r=".05,.11,.24,.31"><p>같은 방향을 보며<br>달려온 두 사람이</p></div>
    <div class="say" data-r=".34,.41,.54,.61"><p>서로의 속도에<br>페달을 맞추다 보니</p></div>
    <div class="say" data-r=".64,.70,.79,.85"><p>어느새 약속한 곳에<br>닿았습니다</p></div>
    <div class="say fin" data-r=".88,.96,2,2">
      <h1><span id="t-groom"></span><small>그리고</small><span id="t-bride"></span></h1>
      <p class="info"><b id="t-date"></b> <b id="t-time"></b><br><span id="t-place"></span></p>
    </div>

    <div id="dial" role="img" aria-label="돌리는 자전거 바퀴"><svg viewBox="0 0 200 200"></svg></div>
    <p id="tip"><span>바퀴를 돌려 주세요<small>화면을 아래로 내려도 달립니다</small></span></p>

    <button id="skip" type="button">바로 보기</button>
    <button id="walk" type="button">눌러서 자동으로 달리기</button>
  </div>
</section>

<main id="content" hidden>
  <section class="sec" id="greet">
    <h2><i class="mark"></i><span id="g-title"></span></h2>
    <div class="lines" id="g-lines"></div>
    <div class="family" id="family"></div>
  </section>

  <section class="sec" id="gallery">
    <h2><i class="mark"></i>우리의 사진</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sec" id="when">
    <h2><i class="mark"></i>예식 일시</h2>
    <p class="big" id="w-date"></p>
    <div class="cal" id="cal"></div>
    <p class="dday" id="dday"></p>
  </section>

  <section class="sec" id="where">
    <h2><i class="mark"></i>오시는 길</h2>
    <p class="venue" id="v-name"></p>
    <p class="addr" id="v-addr"></p>
    <div class="maps" id="maps"></div>
    <dl id="ways"></dl>
  </section>

  <section class="sec" id="rsvp">
    <h2><i class="mark"></i>참석 여부</h2>
    <p class="lead" id="r-lead"></p>
    <form id="rsvp-form" novalidate>
      <fieldset>
        <legend>어느 쪽 하객이신가요</legend>
        <div class="pills">
          <label><input type="radio" name="side" value="groom"><span>신랑 측</span></label>
          <label><input type="radio" name="side" value="bride"><span>신부 측</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>참석하시나요</legend>
        <div class="pills">
          <label><input type="radio" name="attend" value="yes"><span>참석합니다</span></label>
          <label><input type="radio" name="attend" value="no"><span>마음만 전합니다</span></label>
        </div>
      </fieldset>
      <fieldset>
        <label class="t" for="r-name">성함</label>
        <input type="text" id="r-name" name="name" maxlength="20" autocomplete="name" placeholder="홍길동">
      </fieldset>
      <fieldset id="r-more">
        <label class="t" for="r-count">본인 포함 인원</label>
        <select id="r-count" name="count"></select>
      </fieldset>
      <fieldset id="r-meal">
        <legend>식사하시나요</legend>
        <div class="pills">
          <label><input type="radio" name="meal" value="yes" checked><span>식사합니다</span></label>
          <label><input type="radio" name="meal" value="no"><span>식사하지 않습니다</span></label>
        </div>
      </fieldset>
      <button class="send" type="submit">참석 여부 보내기</button>
      <p class="fine">성함과 위 선택만 저장하며, 예식이 끝나면 모두 삭제합니다.</p>
    </form>
  </section>

  <section class="sec" id="contact">
    <h2><i class="mark"></i>연락하기</h2>
    <div id="people"></div>
  </section>

  <footer>
    이 초대장은 앱 설치, 로그인, 본인 인증, 송금을 요구하지 않습니다.<br>
    그런 안내가 보인다면 저희가 보낸 초대장이 아닙니다.
  </footer>
</main>

<div id="closed">예식이 끝나 초대장을 닫았습니다.<br>함께해 주셔서 고맙습니다.</div>

<button id="music" type="button" aria-label="음악 켜기/끄기"><i></i><i></i><i></i></button>
<audio id="bgm" loop preload="none"></audio>

<div id="viewer" role="dialog" aria-label="사진 크게 보기">
  <img alt="">
  <button class="nav prev" type="button">이전 사진</button>
  <button class="nav next" type="button">다음 사진</button>
  <button class="x" type="button">닫기</button>
  <div class="count"></div>
</div>
<div id="toast" role="status"></div>
<div id="trail" aria-hidden="true"></div>

<script>
/* 공통: 본문 채우기, 사진, 참석 여부, 연락 버튼, 음악 */
window.INV = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const params = new URLSearchParams(location.search);

  const [Y, M, D] = CONFIG.wedding.date.split('-').map(Number);
  const wDate = new Date(Y, M - 1, D);
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const timeText = (() => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(CONFIG.wedding.time || '');
    if (!m) return '[예식 시간]';
    const h = +m[1], mm = +m[2];
    return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}시${mm ? ` ${mm}분` : ''}`;
  })();
  const dateText = `${Y}년 ${M}월 ${D}일 ${DOW[wDate.getDay()]}요일`;
  const place = `${CONFIG.wedding.venue} ${CONFIG.wedding.hall}`.trim();

  let toastTimer;
  const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); };

  const bgm = $('#bgm'), musicBtn = $('#music');
  const playMusic = () => { if (bgm && bgm.getAttribute('src')) bgm.play().catch(() => {}); };

  let opened = false;
  const open = () => {
    if (opened) return; opened = true;
    $('#content').hidden = false; document.body.classList.remove('locked');
    const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), { threshold: .22 });
    document.querySelectorAll('.sec, .grid button').forEach(s => io.observe(s));
  };

  const api = { $, el, reduced, params, dateText, timeText, place, toast, playMusic, open, closed: false };

  // 종료일이 지나면 닫기
  if (CONFIG.closeAfter && today > new Date(CONFIG.closeAfter + 'T23:59:59')) {
    $('#intro').remove(); $('#content').remove(); musicBtn.remove();
    $('#closed').style.display = 'flex'; document.body.classList.remove('locked');
    api.closed = true; return api;
  }

  // 첫 화면 글자
  const set = (id, v) => { const n = $(id); if (n) n.textContent = v; };
  set('#t-groom', CONFIG.groom.name); set('#t-bride', CONFIG.bride.name);
  set('#t-date', dateText); set('#t-time', timeText); set('#t-when', `${dateText} ${timeText}`); set('#t-place', place);
  document.title = `${CONFIG.groom.name} 그리고 ${CONFIG.bride.name}, 결혼합니다`;

  // 음악
  if (CONFIG.music && CONFIG.music.src) {
    bgm.src = CONFIG.music.src; bgm.volume = CONFIG.music.volume ?? .5;
    bgm.addEventListener('error', () => musicBtn.classList.remove('ready'));   // 파일이 없으면 버튼 숨김
    bgm.addEventListener('playing', () => musicBtn.classList.add('ready', 'playing'));
    bgm.addEventListener('pause', () => musicBtn.classList.remove('playing'));
    musicBtn.addEventListener('click', () => bgm.paused ? bgm.play().catch(() => {}) : bgm.pause());
    document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.pause(); });
  }

  // 인사말
  $('#g-title').textContent = CONFIG.greeting.title;
  CONFIG.greeting.lines.forEach(l => $('#g-lines').append(el('span', '', l)));
  for (const p of [CONFIG.groom, CONFIG.bride]) {
    const row = el('p');
    row.append(document.createTextNode(`${p.father} · ${p.mother}`), el('em', '', `의 ${p.relation}`), el('b', '', p.name));
    $('#family').append(row);
  }

  // 사진
  const grid = $('#grid'), viewer = $('#viewer'), vImg = $('img', viewer);
  let cur = 0;
  const show = (i) => { const n = CONFIG.photos.length; cur = (i + n) % n; vImg.src = CONFIG.photos[cur]; $('.count', viewer).textContent = `${cur + 1} / ${n}`; };
  CONFIG.photos.forEach((src, i) => {
    const b = el('button'); b.type = 'button'; b.setAttribute('aria-label', `사진 ${i + 1} 크게 보기`);
    const img = new Image(); img.alt = ''; img.loading = 'lazy'; img.decoding = 'async'; img.draggable = false;
    img.onerror = () => { img.remove(); b.disabled = true; b.append(el('span', 'empty', `${src}\n파일을 넣어 주세요`)); };
    img.src = src;
    img.addEventListener('contextmenu', e => e.preventDefault());
    b.append(img); b.addEventListener('click', () => { show(i); viewer.classList.add('open'); });
    grid.append(b);
  });
  $('.x', viewer).addEventListener('click', () => viewer.classList.remove('open'));
  $('.prev', viewer).addEventListener('click', () => show(cur - 1));
  $('.next', viewer).addEventListener('click', () => show(cur + 1));
  vImg.addEventListener('contextmenu', e => e.preventDefault());
  let sx = null;
  viewer.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  viewer.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
  addEventListener('keydown', e => { if (e.key === 'Escape') viewer.classList.remove('open'); });

  // 일시
  const wd = $('#w-date'); wd.textContent = dateText; wd.append(el('span', '', timeText));
  const cal = $('#cal');
  DOW.forEach((d, i) => cal.append(el('span', 'dow' + (i === 0 ? ' sun' : ''), d)));
  const first = new Date(Y, M - 1, 1).getDay(), last = new Date(Y, M, 0).getDate();
  for (let i = 0; i < first; i++) cal.append(el('span'));
  for (let d = 1; d <= last; d++) cal.append(el('span', (d === D ? 'day' : (first + d - 1) % 7 === 0 ? 'sun' : ''), d));
  const left = Math.round((wDate - today) / 864e5);
  $('#dday').textContent = left > 0 ? `예식까지 ${left}일 남았습니다.` : left === 0 ? '오늘, 예식이 열립니다.' : '함께해 주셔서 고맙습니다.';

  // 오시는 길
  $('#v-name').textContent = place;
  $('#v-addr').textContent = CONFIG.wedding.address;
  CONFIG.maps.forEach(m => { const a = el('a', '', m.label); a.href = m.url; a.rel = 'noopener noreferrer'; if (/^https?:/.test(m.url)) a.target = '_blank'; $('#maps').append(a); });
  CONFIG.directions.forEach(w => { const row = el('div', 'way'), dd = el('dd'); w.lines.forEach(l => dd.append(el('p', '', l))); row.append(el('dt', '', w.title), dd); $('#ways').append(row); });

  // 참석 여부
  const [, dm, dd_] = CONFIG.rsvp.deadline.split('-').map(Number);
  $('#r-lead').textContent = `자리와 식사를 넉넉히 준비할 수 있도록 ${dm}월 ${dd_}일까지 알려 주세요.`;
  for (let i = 1; i <= CONFIG.rsvp.maxGuests; i++) { const o = el('option', '', `${i}명`); o.value = i; $('#r-count').append(o); }
  const form = $('#rsvp-form');
  form.addEventListener('change', () => { const no = form.attend.value === 'no'; $('#r-more').hidden = no; $('#r-meal').hidden = no; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = form.name.value.trim();
    if (!form.side.value) return toast('신랑 측인지 신부 측인지 골라 주세요.');
    if (!form.attend.value) return toast('참석 여부를 골라 주세요.');
    if (!name) { form.name.focus(); return toast('성함을 적어 주세요.'); }
    const yes = form.attend.value === 'yes';
    const data = { side: form.side.value, attend: yes, name, count: yes ? +form.count.value : 0, meal: yes && form.meal.value === 'yes' };
    const btn = $('.send', form);
    if (CONFIG.demo) return toast('미리보기 모드라 저장하지 않았습니다. 서버를 연결하면 실제로 전달됩니다.');
    btn.disabled = true;
    try {
      const res = await fetch(CONFIG.api.rsvp, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
      if (!res.ok) throw 0;
      btn.textContent = '참석 여부를 보냈습니다'; toast('참석 여부를 보냈습니다. 고맙습니다.');
    } catch { btn.disabled = false; toast('보내지 못했습니다. 잠시 뒤 다시 눌러 주세요.'); }
  });

  // 연락하기: 번호는 페이지에 없고, 누르는 순간 서버에서 받아 전화·문자 앱으로 넘깁니다.
  const ICON = {
    tel: '<svg viewBox="0 0 24 24"><path d="M6.6 3.5h3l1.5 4-2 1.3a12 12 0 0 0 6.1 6.1l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z"/></svg>',
    sms: '<svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9.5L5 20v-3.5H4z"/><path d="M8 9.5h8M8 12.8h5"/></svg>',
  };
  const nameOf = (id) => ({ groom: CONFIG.groom.name, groom_father: CONFIG.groom.father, groom_mother: CONFIG.groom.mother, bride: CONFIG.bride.name, bride_father: CONFIG.bride.father, bride_mother: CONFIG.bride.mother }[id] || '');
  const reach = async (id, kind, role) => {
    if (CONFIG.demo) return toast(`미리보기 모드입니다. 서버를 연결하면 ${role}에게 ${kind === 'tel' ? '전화' : '문자'}가 연결됩니다.`);
    try {
      const res = await fetch(`${CONFIG.api.contact}?id=${encodeURIComponent(id)}`, { cache: 'no-store' });
      if (!res.ok) throw 0;
      const { n } = await res.json();
      location.href = `${kind}:${n}`;
    } catch { toast('연결하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'); }
  };
  [['신랑 측', CONFIG.contacts.groomSide], ['신부 측', CONFIG.contacts.brideSide]].forEach(([title, list]) => {
    const side = el('div', 'side'); side.append(el('h3', '', title));
    list.forEach(p => {
      const row = el('div', 'person'), who = el('div', 'who');
      who.append(el('small', '', p.role), document.createTextNode(nameOf(p.id)));
      row.append(who);
      for (const kind of ['tel', 'sms']) {
        const b = el('button', 'ico'); b.type = 'button'; b.innerHTML = ICON[kind];
        b.setAttribute('aria-label', `${p.role}에게 ${kind === 'tel' ? '전화하기' : '문자 보내기'}`);
        b.addEventListener('click', () => reach(p.id, kind, p.role));
        row.append(b);
      }
      side.append(row);
    });
    $('#people').append(side);
  });

  return api;
})();
</script>
<script>
(() => {
  const I = window.INV; if (I.closed) return;
  const { $, el, reduced, params } = I;
  const intro = $('#intro'), stage = $('#stage'), NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.append(n); return n; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  I.open();   // 이 버전은 화면을 잠그지 않습니다. 걷는 구간 아래에 본문이 이어집니다.

  /* ── 먼 풍경: 산, 남산, 건물 ── */
  const far = $('#far svg');
  mk('path', { class: 'hill', d: 'M-10 150 C40 138 80 112 130 108 C170 105 200 126 250 132 L250 150 Z' }, far);
  mk('path', { class: 'hill b', d: 'M190 150 C240 142 280 100 330 82 C346 77 360 82 378 96 C410 120 450 136 556 142 L556 150 Z' }, far);
  const tw = mk('g', { class: 'tower' }, far);
  mk('rect', { x: 336.2, y: 46, width: 1.6, height: 38 }, tw); mk('rect', { x: 333.5, y: 60, width: 7, height: 5, rx: 1.2 }, tw); mk('rect', { x: 336.7, y: 36, width: .6, height: 11 }, tw);
  const sl = mk('g', { class: 'sky-line' }, far);
  for (let x = -4; x < 550;) { const w = rnd(7, 18), h = rnd(6, 22) + (Math.random() < .14 ? 16 : 0); mk('rect', { x, y: 150 - h, width: w, height: h }, sl); x += w + rnd(1, 6); }

  /* ── 강 위: 먼 다리, 오리배, 유람선, 멀리 세빛섬 ── */
  const mid = $('#mid svg');
  mk('path', { class: 'span deck', d: 'M96 53 H452' }, mid);
  for (let x = 110; x < 440; x += 46) { mk('path', { class: 'span', d: `M${x} 53 V60 M${x} 53 Q${x + 23} 30 ${x + 46} 53` }, mid); for (let k = 1; k < 5; k++) { const xx = x + k * 9.2, t = k / 5, y = 53 - 4 * 23 * t * (1 - t) / 2; mk('path', { class: 'span', d: `M${xx} 53 V${y.toFixed(1)}`, opacity: .7 }, mid); } }
  mk('path', { class: 'span', d: 'M432 53 V60' }, mid);

    if (now !== arrived) { arrived = now; stage.classList.toggle('arrived', now); walkBtn.textContent = now ? '초대장 읽기' : '눌러서 자동으로 달리기'; }
    lastY = y;
    const max = document.documentElement.scrollHeight - innerHeight, from = intro.offsetHeight - 20;
    trail.classList.toggle('on', y > from);
    trail.style.setProperty('--q', max > from ? Math.min(1, Math.max(0, (y - from) / (max - from))).toFixed(4) : 0);
  };
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(render); } }, { passive: true });
  addEventListener('resize', render);
  render();

  // 버튼을 누르면 두 사람이 알아서 끝까지 걷습니다. 화면을 만지면 멈춥니다.
  let auto = 0;
  const stopAuto = () => { if (auto) { cancelAnimationFrame(auto); auto = 0; } };
  const autoWalk = () => {
    if (reduced) return scrollTo(0, span());
    let pos = scrollY, last = performance.now();
    const step = (t) => { const dt = Math.min(50, t - last); last = t; pos += dt * innerHeight * .00052; if (pos >= span()) { scrollTo(0, span()); auto = 0; return; } scrollTo(0, pos); auto = requestAnimationFrame(step); };
    auto = requestAnimationFrame(step);
  };
  for (const ev of ['touchstart', 'wheel', 'keydown']) addEventListener(ev, stopAuto, { passive: true });
  walkBtn.addEventListener('click', () => { stopAuto(); if (arrived) $('#greet').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }); else autoWalk(); });
  $('#skip').addEventListener('click', () => { stopAuto(); $('#greet').scrollIntoView({ behavior: 'auto' }); });


  // 바퀴를 손가락으로 돌리면 그만큼 달립니다. 놓으면 관성으로 조금 더 굴러갑니다.
  let grip = null, acc = 0, vel = 0, coast = 0, lastT = 0;
  const angle = (e) => { const r = dial.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
  const push = (rad) => { acc = Math.min(span(), Math.max(0, acc + rad * span() / (Math.PI * 2 * TURNS))); scrollTo(0, acc); };
  dial.addEventListener('pointerdown', (e) => {
    stopAuto(); cancelAnimationFrame(coast); e.preventDefault();
    try { dial.setPointerCapture(e.pointerId); } catch {}
    grip = angle(e); acc = scrollY; vel = 0; lastT = performance.now();
  });
  dial.addEventListener('pointermove', (e) => {
    if (grip == null) return;
    const a = angle(e); let d = a - grip; if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
    grip = a; const t = performance.now(), dt = Math.max(8, t - lastT); lastT = t;
    vel = vel * .6 + (d / dt) * .4; push(d);
  });
  const release = () => {
    if (grip == null) return; grip = null;
    if (reduced || Math.abs(vel) < .0012) return;
    let last = performance.now();
    const step = (t) => { const dt = Math.min(40, t - last); last = t; vel *= Math.pow(.955, dt / 16); push(vel * dt); if (Math.abs(vel) > .0004 && acc > 0 && acc < span()) coast = requestAnimationFrame(step); };
    coast = requestAnimationFrame(step);
  };
  dial.addEventListener('pointerup', release); dial.addEventListener('pointercancel', release);

  /* ── 음악: 스크롤만으로는 재생이 허용되지 않아, 첫 터치에 시작합니다 ── */
  if (CONFIG.music && CONFIG.music.src) {
    $('#music').classList.add('ready');
    const first = () => { I.playMusic(); removeEventListener('pointerup', first); };
    addEventListener('pointerup', first);
  }

  /* ── 본문 보완 ── */
  document.querySelectorAll('#family p').forEach(p => { const b = p.querySelector('b'), sp = document.createElement('span'); while (p.firstChild !== b) sp.append(p.firstChild); p.prepend(sp); });
  const copy = el('button', 'copy', '주소 복사'); copy.type = 'button'; $('#v-addr').after(copy);
  copy.addEventListener('click', async () => {
    const text = CONFIG.wedding.address;
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
    I.toast('주소를 복사했습니다.');
  });
  // 대표 사진 자리에 짧은 영상 넣기 (CONFIG.video.src 를 채웠을 때만)
  if (CONFIG.video && CONFIG.video.src) {
    const box = el('div', 'vid'), v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'none'; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    if (CONFIG.video.poster) v.poster = CONFIG.video.poster;
    v.src = CONFIG.video.src; box.append(v); $('#grid').prepend(box);
    new IntersectionObserver(([e]) => { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }, { threshold: .35 }).observe(box);
  }

  if (params.has('p')) requestAnimationFrame(() => scrollTo(0, span() * +params.get('p')));
  if (params.has('skip')) requestAnimationFrame(() => $('#greet').scrollIntoView());
})();
</script>
</body>
</html>
